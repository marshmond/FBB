name: Nightly update

on:
  schedule:
    - cron: '0 10 * * *'   # 10:00 UTC = 6am Eastern, after West Coast games finish
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to process (YYYY-MM-DD). Blank = yesterday.'
        required: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch stats and write recaps
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/nightly.mjs ${{ github.event.inputs.date }}
      - name: Commit results
        run: |
          git config user.name "dugout-digest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs config/id-cache.json
          git diff --staged --quiet || git commit -m "Nightly update"
          git push
